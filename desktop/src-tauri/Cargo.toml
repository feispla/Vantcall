[package]
name = "vants-desktop"
version = "1.0.0"
description = "VANTS — app de escritorio"
authors = ["FEISS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vants_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
