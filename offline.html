<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Offline — VANTS</title>
  <meta name="description" content="Estás sin conexión. VANTS intentará recargar cuando recuperes la red.">
  <link rel="stylesheet" href="./bundle.css">
  <style>body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0b131b;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.offline{max-width:560px;padding:24px;text-align:center}.offline h1{margin:0 0 8px} .offline p{opacity:.9}</style>
</head>
<body>
  <main class="offline" role="main">
    <img src="./assets/brand/vants-mark.svg" alt="VANTS" width="72" height="72">
    <h1>Sin conexión</h1>
    <p>Parece que estás sin red. Algunas funciones pueden no estar disponibles offline.</p>
    <p>
      <button onclick="location.reload()">Reintentar</button>
    </p>
  </main>
</body>
</html>
